[package]
name = "fingerprint-settings"
description = "Manage your own fingerprints with any fprintd-compatible service (net.reactivated.Fprint)"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/validity-rs/fingerprint-settings"
publish = false

[dependencies]
# The oldest GTK and libadwaita supported are Debian 13's (GTK 4.18, libadwaita
# 1.7): the feature flags match them, nothing newer.
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
futures-core = "0.3.34"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_18"] }
# The D-Bus side runs on a thread of its own, driven by zbus::block_on.
zbus = { version = "6.1.0", default-features = false, features = ["default-rt", "proxy"] }
# A runtime-agnostic channel between the GTK main loop and the D-Bus thread,
# and the deadlines of the calls (zbus's own runtime).
zruntime = { version = "0.2.1", default-features = false, features = ["mpmc", "runtime"] }

[dev-dependencies]
# examples/stub_service.rs serves the fprintd API (the packages' smoke test).
# The end-to-end test against validity-rs's daemon is a package of its own,
# e2e/, so that nothing here depends on validity-rs.
zbus = { version = "6.1.0", default-features = false, features = ["default-rt", "proxy", "service"] }

[lints.rust]
# No warning is tolerated: a plain `cargo build/test/clippy/doc` fails on any.
warnings = "deny"
unsafe_code = "forbid"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }

[lints.rustdoc]
all = { level = "deny", priority = -1 }

# The Debian package (cargo-deb, built by ci/packages/debian.sh in the pinned
# Debian 13 image). The translations are compiled into the binary: there are
# no .mo files to ship.
[package.metadata.deb]
maintainer = "pierre-warnier <409744+pierre-warnier@users.noreply.github.com>"
copyright = "2026 validity-rs contributors"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
# $auto: the shared libraries the binary links (libgtk-4-1, libadwaita-1-0,
# ...), found by dpkg-shlibdeps. Any service that speaks fprintd's API will
# do; validity-rs's daemon is one.
depends = "$auto, fprintd | validity-daemon"
changelog = "packaging/debian/changelog"
extended-description = """\
A small desktop application to register your right index finger, or remove \
it, in one plain screen. Made for desktops without fingerprint \
settings of their own, such as Xfce, MATE and LXQt. It works with any \
fingerprint service that speaks the fprintd D-Bus interface, fprintd itself \
included. Your password always keeps working."""
assets = [
    ["target/release/fingerprint-settings", "usr/bin/", "755"],
    ["packaging/common/io.github.validity_rs.FingerprintSettings.desktop", "usr/share/applications/", "644"],
    ["packaging/common/io.github.validity_rs.FingerprintSettings.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/common/icons/hicolor/scalable/apps/io.github.validity_rs.FingerprintSettings.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/common/fingerprint-settings.1", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/fingerprint-settings/", "644"],
    ["packaging/debian/lintian-overrides", "usr/share/lintian/overrides/fingerprint-settings", "644"],
]
