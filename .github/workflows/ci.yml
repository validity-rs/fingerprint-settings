name: CI

# Pushes to branches and pull requests are the gate; the weekly run notices
# drift nobody committed (a distro package update, a registry change). Tags
# run it through the release workflow (workflow_call), which releases only
# when all of it is green.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  workflow_call:

# A newer push supersedes the run in flight for the same ref; scheduled and
# manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  no-ai-traces:
    name: No AI traces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script checks every commit, so it needs all of them.
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages, added lines, paths and pull request text
        env:
          # Passed through the environment, never interpolated into the shell.
          PR_TITLE: ${{ github.event.pull_request.user.type != 'Bot' && github.event.pull_request.title || '' }}
          PR_BODY: ${{ github.event.pull_request.user.type != 'Bot' && github.event.pull_request.body || '' }}
        run: ci/run.sh noai

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/run.sh zizmor
        env:
          CI_TOOLS: ${{ runner.temp }}

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ci/run.sh gitleaks
        env:
          CI_TOOLS: ${{ runner.temp }}

  # fmt, clippy, doc and the desktop entry and metainfo, in the Debian 13
  # image (docker/Dockerfile.debian).
  rust:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: [fmt, clippy, doc, packaging]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Through the environment, not interpolated into the script (zizmor: template-injection).
      - run: ci/run.sh "$JOB"
        env:
          JOB: ${{ matrix.job }}

  # cargo test in each distro's image, with its own GTK 4 and libadwaita.
  distro:
    name: Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, ubuntu-resolute, fedora, archlinux, alpine]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/run.sh "distro:$DISTRO"
        env:
          DISTRO: ${{ matrix.distro }}

  # The application's core against validity-rs's daemon with its emulated
  # sensor (e2e/), validity-rs fetched by cargo at the pinned commit.
  e2e:
    name: End to end (validity-rs daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/run.sh e2e

  # Each package's whole cycle: vendored tarball, package built and checked
  # (lintian, rpmlint, namcap, apkbuild-lint), then installed, launched
  # headless and removed in a fresh container of its distro.
  package:
    name: Package (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, ubuntu-resolute, fedora, archlinux, alpine]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ci/run.sh "package:$DISTRO"
        env:
          DISTRO: ${{ matrix.distro }}
      # The packages of this commit, to try them by hand (not a release).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.distro }}
          path: dist/${{ matrix.distro }}/
          if-no-files-found: error
          retention-days: 14
